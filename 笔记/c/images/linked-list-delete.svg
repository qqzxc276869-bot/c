<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .step { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
      .code { font: 600 22px Consolas, monospace; fill: #991b1b; }
      .label { font: 600 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .warn { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #b91c1c; }
      .value { font: 700 24px Consolas, monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .field { font: 600 16px Consolas, monospace; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .normal { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .target { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
      .freed { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 7; opacity: 0.65; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .target-arrow { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow-red); }
      .detached { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="52" class="title" text-anchor="middle">单链表：删除节点 B</text>

  <g transform="translate(40,82)">
    <rect width="1320" height="205" rx="18" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="step">1. 删除前：prev 指向前驱 A，target 指向待删节点 B</text>
    <text x="93" y="123" class="label">head</text>
    <path d="M 135 117 L 250 117" class="arrow"/>
    <g transform="translate(255,82)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">10</text><text x="130" y="35" class="field">next</text></g>
    <text x="335" y="73" class="label" text-anchor="middle">A / prev</text>
    <path d="M 415 117 L 560 117" class="arrow"/>
    <g transform="translate(565,82)"><rect width="160" height="70" rx="10" class="target"/><line x1="100" y1="0" x2="100" y2="70" stroke="#dc2626" stroke-width="3"/><text x="50" y="35" class="value">20</text><text x="130" y="35" class="field">next</text></g>
    <text x="645" y="73" class="warn" text-anchor="middle">B / target</text>
    <path d="M 725 117 L 870 117" class="target-arrow"/>
    <g transform="translate(875,82)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">30</text><text x="130" y="35" class="field">NULL</text></g>
  </g>

  <g transform="translate(40,307)">
    <rect width="1320" height="205" rx="18" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="step">2. 先跨过 B，接好链表：</text>
    <text x="370" y="38" class="code">prev-&gt;next = target-&gt;next;</text>
    <text x="93" y="123" class="label">head</text>
    <path d="M 135 117 L 250 117" class="arrow"/>
    <g transform="translate(255,82)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">10</text><text x="130" y="35" class="field">next</text></g>
    <text x="335" y="73" class="label" text-anchor="middle">A / prev</text>
    <path d="M 415 117 C 560 35, 770 35, 870 117" class="arrow"/>
    <g transform="translate(875,82)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">30</text><text x="130" y="35" class="field">NULL</text></g>
    <g transform="translate(565,112)"><rect width="160" height="70" rx="10" class="target"/><line x1="100" y1="0" x2="100" y2="70" stroke="#dc2626" stroke-width="3"/><text x="50" y="35" class="value">20</text><text x="130" y="35" class="field">next</text></g>
    <text x="645" y="103" class="warn" text-anchor="middle">B 已脱链，但尚未释放</text>
    <path d="M 725 147 L 865 147" class="detached"/>
  </g>

  <g transform="translate(40,532)">
    <rect width="1320" height="245" rx="18" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="step">3. 最后释放 B：</text>
    <text x="240" y="38" class="code">free(target);</text>
    <text x="28" y="72" class="warn">释放后绝不能再读取 target-&gt;data 或 target-&gt;next。</text>
    <text x="93" y="160" class="label">head</text>
    <path d="M 135 154 L 330 154" class="arrow"/>
    <g transform="translate(335,119)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">10</text><text x="130" y="35" class="field">next</text></g>
    <path d="M 495 154 L 690 154" class="arrow"/>
    <g transform="translate(695,119)"><rect width="160" height="70" rx="10" class="normal"/><line x1="100" y1="0" x2="100" y2="70" stroke="#2563eb" stroke-width="3"/><text x="50" y="35" class="value">30</text><text x="130" y="35" class="field">NULL</text></g>
    <g transform="translate(1010,119)"><rect width="160" height="70" rx="10" class="freed"/><line x1="100" y1="0" x2="100" y2="70" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/><text x="50" y="35" class="value" fill="#64748b">20</text><text x="130" y="35" class="field">已释放</text><path d="M 12 10 L 148 60 M 148 10 L 12 60" stroke="#dc2626" stroke-width="5"/></g>
    <text x="1090" y="110" class="warn" text-anchor="middle">B 不再属于程序</text>
    <text x="595" y="224" class="label" text-anchor="middle">最终链表：10 → 30 → NULL</text>
  </g>
</svg>
